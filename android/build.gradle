buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        // 1. Cari di Google rasmi dulu
        google()
        
        // 2. ✅ JALAN TIKUS: Guna Mirror Google untuk Maven Central (PENTING!)
        // Ini akan elak error 403 Forbidden dari server asal
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        
        // 3. Fallback ke server asal (kalau mirror tak jumpa)
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        // Ulang strategi sama untuk semua sub-projek
        google()
        
        // ✅ JALAN TIKUS DI SINI JUGA
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        
        mavenCentral()
        
        // Tambahan untuk sesetengah lib lama
        maven { url "https://jitpack.io" }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
